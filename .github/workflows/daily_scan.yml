name: Daily Stock Scanner

on:
  # Runs at 4:00 PM IST (10:30 AM UTC) on weekdays (Mon-Fri)
  schedule:
    - cron: '30 10 * * 1-5'

  # Manual trigger from GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Cache stock data
        uses: actions/cache@v4
        with:
          path: |
            data/cache/
            data/fundamentals_cache.json
            data/nifty500_list.json
          key: stock-data-${{ github.run_number }}
          restore-keys: |
            stock-data-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Nifty 500 scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --nifty500 --telegram

      - name: Commit scan JSON to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scans/
          git diff --cached --quiet || git commit -m "Daily scan $(date +%Y-%m-%d)"
          git push

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-report-${{ github.run_number }}
          path: reports/
          retention-days: 30
